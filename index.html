<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141a16">
  <title>Aria</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="pre">
    <div id="zone-toast"><div class="map">Aria</div><div class="zone"></div></div>
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="clock"><i></i><span>06:00</span></div>
    <div id="quests"></div>
    <canvas id="hearts" width="220" height="44"></canvas>
    <div id="lvl"><b>Lv 1</b><i><s></s></i><em hidden>+</em></div>
    <div id="btn-bag" class="btn" data-btn="bag" aria-label="Bag">
      <svg viewBox="0 0 48 48"><path d="M14 18h20l3 22H11z" /><path d="M18 18c0-6 3-9 6-9s6 3 6 9" /><path d="M17 27h14" /></svg>
    </div>
    <div id="toasts"></div>
    <div id="hotbar"></div>
    <div id="hurt"></div>
    <div id="faint"><div>You fainted…</div><small>Returning to camp</small></div>
    <div id="hint">Tap the ground to walk · Tap a monster to attack · Drag to turn the camera</div>
    <div id="fps"></div>
  </div>
  <div id="panel" class="panel"></div>
  <div id="title">
    <div class="logo">
      <h1>Aria</h1>
      <p class="tagline">A little valley adventure</p>
    </div>
    <div class="menu">
      <button id="t-continue" class="tbtn main">Start</button>
      <button id="t-new" class="tbtn" hidden>New Game</button>
      <button id="t-sound" class="tbtn small">Sound: On</button>
    </div>
    <small class="rotate">↻ Turn your phone sideways for the best view</small>
    <small class="ver">v1.0 · Explore, fight, craft, survive the night</small>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
