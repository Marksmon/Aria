<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141a16">
  <title>Aibachu</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="pre">
    <div id="zone-toast"><div class="map">Aibachu</div><div class="zone"></div></div>
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="clock"><i></i><span>06:00</span></div>
    <canvas id="hearts" width="400" height="44"></canvas>
    <div id="btn-bag" class="btn" data-btn="bag" aria-label="Bag">
      <svg viewBox="0 0 48 48"><path d="M14 18h20l3 22H11z" /><path d="M18 18c0-6 3-9 6-9s6 3 6 9" /><path d="M17 27h14" /></svg>
    </div>
    <div id="toasts"></div>
    <div id="joy"><div id="joy-knob"></div></div>
    <div id="btns">
      <div id="btn-action" class="btn" data-btn="action" aria-label="Use" hidden>
        <img alt=""><span></span>
      </div>
      <div id="btn-dodge" class="btn" data-btn="dodge" aria-label="Dodge">
        <svg viewBox="0 0 48 48"><path d="M10 30c4 8 18 10 25 2" /><path d="M31 26l5 6-7 2" /><path d="M14 18c3-6 12-9 19-5" /></svg>
      </div>
      <div id="btn-attack" class="btn" data-btn="attack" aria-label="Attack">
        <svg viewBox="0 0 48 48"><path d="M33 9l6 0 0 6-17 17-6-6z" /><path d="M14 26l8 8" /><path d="M16 32l-6 6" /><circle cx="9" cy="39" r="2.5" /></svg>
      </div>
    </div>
    <div id="hurt"></div>
    <div id="faint"><div>You fainted…</div><small>Returning to camp</small></div>
    <div id="hint">Hold ⚔ to attack · Tap ↻ to dodge · Drag right side to rotate</div>
    <div id="fps"></div>
  </div>
  <div id="panel" class="panel"></div>
  <div id="title">
    <div class="logo">
      <h1>Aibachu</h1>
      <p class="tagline">A little valley adventure</p>
    </div>
    <div class="menu">
      <button id="t-continue" class="tbtn main">Start</button>
      <button id="t-new" class="tbtn" hidden>New Game</button>
      <button id="t-sound" class="tbtn small">Sound: On</button>
    </div>
    <small class="ver">v1.0 · Explore, fight, craft, survive the night</small>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
