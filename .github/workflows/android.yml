name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web game
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          node build-tools/patch-android.mjs
          npx cap sync android

      - name: Use fixed debug key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp build-tools/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Aria.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Aria.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Aria — latest build #${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. ${MSG:-Manual run}"

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-apk
          path: Aria.apk
