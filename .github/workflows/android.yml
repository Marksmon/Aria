name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }} # the APK's version: each build installs over the last
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web game
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          node build-tools/patch-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # every APK must carry the same signature (build-tools/debug.keystore, set by patch-android.mjs),
      # or phones refuse it as an update and the player has to uninstall, losing the save
      - name: Check the APK is signed with the fixed key
        run: |
          want=$(keytool -list -v -keystore build-tools/debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "key: $want"
          echo "apk: $got"
          test -n "$want" && test "$want" = "$got"

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Aria.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Aria.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Aria — latest build #${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. ${MSG:-Manual run}"

      - uses: actions/upload-artifact@v4
        with:
          name: Aria-apk
          path: Aria.apk
